services:
  website-backend:
    image: ghcr.io/wirelessfish/website-backend:latest
    networks: [website]
    container_name: website-backend
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:6778:6778"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    env_file:
      - .env
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: website-backend-tunnel
    restart: unless-stopped
    networks: [website]
    command: tunnel run --url http://website-backend:6778
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - website-backend

networks:
  website:
